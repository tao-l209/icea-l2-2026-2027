<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Employées</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <button class="btn btn-outline-light me-3" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar" aria-expanded="true" aria-controls="sidebar" aria-label="Afficher ou masquer le menu latéral">
                <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
            <span class="navbar-brand mb-0 h1">Dashboard Employées</span>
        </div>
    </nav>

    <style>
        .sidebar-content {
            width: 250px;
            min-height: calc(100vh - 50px);
            background-color: #102a52;
        }

        .sidebar .nav-link {
            color: #dbeafe;
        }

        .sidebar .nav-link.active {
            color: #fff;
            background-color: #2563eb;
        }

        .menu-icon {
            display: flex;
            width: 20px;
            height: 16px;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-icon span {
            display: block;
            height: 2px;
            background-color: currentColor;
        }
    </style>

    <main class="container-fluid px-0">
        <div class="d-flex align-items-stretch">
            <aside class="collapse collapse-horizontal show sidebar" id="sidebar">
                <div class="sidebar-content p-3">
                    <nav class="nav nav-pills flex-column gap-2" role="tablist" aria-orientation="vertical">
                        <button class="nav-link active text-start" id="employees-tab" data-bs-toggle="pill" data-bs-target="#employees-panel" type="button" role="tab" aria-controls="employees-panel" aria-selected="true">
                            Onglet 1
                        </button>
                        <button class="nav-link text-start" id="second-tab" data-bs-toggle="pill" data-bs-target="#second-panel" type="button" role="tab" aria-controls="second-panel" aria-selected="false">
                            Onglet 2
                        </button>
                    </nav>
                </div>
            </aside>

            <div class="flex-grow-1 p-3 p-md-4">
                <div class="tab-content">
                    <section class="tab-pane fade show active" id="employees-panel" role="tabpanel" aria-labelledby="employees-tab" tabindex="0">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white fw-bold">Liste des employées</div>
                            <div class="card-body p-0">
                                <table class="table table-hover mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>ID</th>
                                            <th>Noms</th>
                                            <th>Prénoms</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {% for item in employees %}
                                        <tr>
                                            <td>{{ item.id }}</td>
                                            <td>{{ item.nom }}</td>
                                            <td>{{ item.prenom }}</td>
                                        </tr>
                                        {% else %}
                                        <tr>
                                            <td colspan="3" class="text-center text-muted">Aucune employée trouvée.</td>
                                        </tr>
                                        {% endfor %}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </section>

                    <section class="tab-pane fade" id="second-panel" role="tabpanel" aria-labelledby="second-tab" tabindex="0">
                        <div class="card shadow-sm border-0">
                            <div class="card-body text-muted">Vide</div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
